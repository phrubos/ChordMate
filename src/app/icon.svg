<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Transparent background -->
  <rect width="512" height="512" fill="transparent" />
  
  <g filter="url(#shadow)">
    <!-- Main Guitar Pick Shape -->
    <!-- Wider at top, curving down to a distinct point at the bottom -->
    <path 
      d="M 256 64 C 360 64 432 100 432 200 C 432 340 300 448 256 464 C 212 448 80 340 80 200 C 80 100 152 64 256 64 Z" 
      fill="url(#primary)" 
    />
    
    <!-- Edge highlight for 3D plastic/celluloid effect -->
    <path 
      d="M 256 64 C 360 64 432 100 432 200 C 432 340 300 448 256 464 C 212 448 80 340 80 200 C 80 100 152 64 256 64 Z" 
      fill="none"
      stroke="url(#edge)"
      stroke-width="8"
    />
  </g>

  <!-- Sharp, geometric capital M -->
  <path 
    d="M 150 310 L 150 170 L 256 260 L 362 170 L 362 310"
    fill="none"
    stroke="#022c22"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
