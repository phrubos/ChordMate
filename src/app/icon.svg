<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a241f" />
      <stop offset="100%" stop-color="#110d0a" />
    </linearGradient>

    <!-- Guitar Body Golden Gradient -->
    <linearGradient id="guitarBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" /> <!-- Amber 500 -->
      <stop offset="50%" stop-color="#d97706" /> <!-- Amber 600 -->
      <stop offset="100%" stop-color="#b45309" /> <!-- Amber 700 -->
    </linearGradient>
    
    <!-- Soundhole Shadow -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="8"/>
      <feGaussianBlur stdDeviation="6" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Transparent Background -->
  <rect width="512" height="512" rx="112" fill="transparent" />
  
  <g transform="rotate(-40 256 256) translate(-20, 20)">
    
    <!-- Guitar Neck -->
    <path 
      d="M236,40 L276,40 L276,210 L236,210 Z" 
      fill="#451a03" 
    />
    
    <!-- Frets (Subtle) -->
    <line x1="236" y1="60" x2="276" y2="60" stroke="#78350f" stroke-width="3" />
    <line x1="236" y1="90" x2="276" y2="90" stroke="#78350f" stroke-width="3" />
    <line x1="236" y1="120" x2="276" y2="120" stroke="#78350f" stroke-width="3" />
    <line x1="236" y1="150" x2="276" y2="150" stroke="#78350f" stroke-width="3" />
    <line x1="236" y1="180" x2="276" y2="180" stroke="#78350f" stroke-width="3" />

    <!-- Headstock -->
    <path 
      d="M236,40 L224,10 L228,-15 C232,-35 240,-40 256,-40 C272,-40 280,-35 284,-15 L288,10 L276,40 Z" 
      fill="#291102" 
    />
    <!-- Tuning Pegs (3-3 arrangement) -->
    <circle cx="216" cy="20" r="7" fill="#d4d4d8" />
    <circle cx="212" cy="-2" r="7" fill="#d4d4d8" />
    <circle cx="216" cy="-24" r="7" fill="#d4d4d8" />
    
    <circle cx="296" cy="20" r="7" fill="#d4d4d8" />
    <circle cx="300" cy="-2" r="7" fill="#d4d4d8" />
    <circle cx="296" cy="-24" r="7" fill="#d4d4d8" />

    <!-- Guitar Body (Acoustic figure-8 shape) -->
    <!-- Utilizing bezier curves for realistic upper bout, waist, and lower bout -->
    <path 
      d="
        M256,460 
        C350,460 390,400 370,330 
        C350,260 380,220 340,180 
        C300,140 212,140 172,180 
        C132,220 162,260 142,330 
        C122,400 162,460 256,460 
        Z" 
      fill="url(#guitarBody)" 
      stroke="#78350f"
      stroke-width="6"
    />
    
    <!-- Pickguard -->
    <path 
      d="M260,280 C310,280 340,310 330,360 C320,410 280,430 250,430 C270,390 280,350 260,280 Z" 
      fill="#451a03" 
      opacity="0.8"
    />

    <!-- Original Soundhole with Inner Shadow effect -->
    <!-- The outer ring -->
    <circle cx="256" cy="270" r="48" fill="none" stroke="#fed7aa" stroke-width="4" opacity="0.6"/>
    <circle cx="256" cy="270" r="42" fill="none" stroke="#78350f" stroke-width="2" opacity="0.8"/>
    <!-- The actual hole -->
    <circle cx="256" cy="270" r="38" fill="#110d0a" filter="url(#innerShadow)" />

    <!-- Bridge -->
    <rect x="206" y="380" width="100" height="24" rx="6" fill="#291102" />
    <rect x="216" y="386" width="80" height="4" rx="2" fill="#d4d4d8" />
    <!-- Bridge Pins -->
    <circle cx="236" cy="396" r="3" fill="#000" />
    <circle cx="244" cy="396" r="3" fill="#000" />
    <circle cx="252" cy="396" r="3" fill="#000" />
    <circle cx="260" cy="396" r="3" fill="#000" />
    <circle cx="268" cy="396" r="3" fill="#000" />
    <circle cx="276" cy="396" r="3" fill="#000" />

    <!-- Guitar Strings (All 6) -->
    <line x1="236" y1="-20" x2="236" y2="390" stroke="#fcd34d" stroke-width="2" opacity="0.8" />
    <line x1="244" y1="-20" x2="244" y2="390" stroke="#fcd34d" stroke-width="1.8" opacity="0.75" />
    <line x1="252" y1="-20" x2="252" y2="390" stroke="#fcd34d" stroke-width="1.5" opacity="0.7" />
    <line x1="260" y1="-20" x2="260" y2="390" stroke="#e4e4e7" stroke-width="1.2" opacity="0.6" />
    <line x1="268" y1="-20" x2="268" y2="390" stroke="#e4e4e7" stroke-width="1" opacity="0.5" />
    <line x1="276" y1="-20" x2="276" y2="390" stroke="#e4e4e7" stroke-width="0.8" opacity="0.4" />
  </g>
</svg>
