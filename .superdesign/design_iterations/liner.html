<!doctype html>
<html lang="hu" data-dir="liner">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChordMate — 2. Liner Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..800,0..100;1,9..144,300..800,0..100&family=Hanken+Grotesk:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
/* ===== 2. LINER NOTES =====
   Lemezborító / magazin: krémpapír + tinta, vermilion akcent, nagy serif címek,
   hajszálvonalak dobozok helyett, a borítók a főszereplők. */
:root {
  --font-display: "Fraunces", serif;
  --font-body: "Hanken Grotesk", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
  --ink: oklch(.2 .015 60);
  --cream: oklch(.955 .016 85);
  --page: oklch(.92 .02 82);
  --bg: var(--cream);
  --bg-2: var(--cream);
  --surface: oklch(.975 .01 85);
  --surface-2: oklch(.925 .02 84);
  --line: oklch(.2 .02 60 / .13);
  --line-strong: oklch(.2 .02 60 / .26);
  --text: var(--ink);
  --text-2: oklch(.42 .02 60);
  --text-3: oklch(.55 .02 60);
  --accent: oklch(.6 .19 35);
  --accent-2: oklch(.54 .19 35);
  --accent-text: oklch(.52 .18 35);
  --on-accent: #fff;
  --accent-soft: oklch(.6 .19 35 / .1);
  --done: oklch(.48 .1 155);
  --fav: var(--accent);
  --st-learning: oklch(.6 .14 62);
  --st-ok: oklch(.48 .12 255);
  --st-ready: oklch(.5 .11 155);
  --diff: var(--ink);
  --radius: 4px; --radius-sm: 3px; --radius-lg: 4px; --radius-xl: 6px; --radius-chip: 2px; --radius-cover: 2px; --radius-btn: 99px;
  --display-weight: 500; --display-track: -0.02em; --display-track-sm: -0.01em;
  --eyebrow-track: .1em;
  --hero: 64px; --hero-sm: 40px; --h1: 60px; --h1-sm: 40px; --h3: 26px; --hub-title: 80px; --hub-title-sm: 32px;
  --cv-l1: .7; --cv-l2: .46; --cv-c: .15;
  --seg-shadow: none;
  --icon-stroke: 1.5;
}
body { color-scheme: light; }
.eyebrow, .cal-wd, .song-row-head, .sheet-label { font-family: var(--font-mono); font-weight: 500; }
.page-title, .hero-title, .hub-title, .pr-title, .card-title, .brand-name { font-variation-settings: "SOFT" 50, "opsz" 144; }
.page-title .count { font-family: var(--font-display); font-style: italic; font-size: .45em; color: var(--accent-text); }
.hero-date, .hub-title em { font-style: italic; color: var(--accent); font-weight: 400; }

/* masthead: a sidebar vízszintes fejléccé alakul */
.app { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "side top" "main main" "dock dock"; }
.sidebar { height: 68px; flex-direction: row; align-items: center; gap: 36px; padding: 0 0 0 40px; border-right: 0; border-bottom: 2px solid var(--ink); z-index: 21; }
.brand { padding: 0; }
.brand-name { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
.logo-bg { fill: var(--ink); } .logo-mark { stroke: var(--cream); }
.band-switch, .side-tools, .side-user { display: none; }
.side-nav { flex-direction: row; gap: 4px; }
.nav-item { padding: 6px 10px; border-radius: 0; font-size: 15px; color: var(--text-2); }
.nav-item .i { display: none; }
.nav-item:hover { background: none; color: var(--text); }
.nav-item.active { background: none; color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.topbar { height: 68px; padding: 0 40px 0 24px; border-bottom: 2px solid var(--ink); background: var(--bg); backdrop-filter: none; }
.search-trigger { margin-left: auto; width: 300px; border-radius: 99px; background: transparent; border-color: var(--line-strong); }
.top-actions { margin-left: 0; }
.main { margin: 0 auto; padding: 44px 40px 56px; max-width: 1320px; }

/* gombok, chipek */
.btn-ghost { background: transparent; border-color: var(--ink); }
.btn-ghost:hover { background: var(--ink); color: var(--cream); }
.btn-chip { border-radius: 99px; }
.chip { background: none; border: 0; padding: 0; margin-right: 10px; color: var(--text-2); font-size: 13px; }
.chip + .chip::before { content: "·"; margin-right: 10px; color: var(--text-3); }
.seg { border-radius: 99px; background: transparent; border-color: var(--line-strong); }
.seg button { border-radius: 99px; }
.seg button.on { background: var(--ink); color: var(--cream); }
.seg button.on em { color: oklch(.8 .02 85); }
.af-chip { border-radius: 99px; background: transparent; box-shadow: inset 0 0 0 1px var(--accent); }

/* kártyák: hajszálvonalas rovatok */
.card { background: transparent; border: 0; border-top: 2px solid var(--ink); border-radius: 0; padding: 16px 0 0; }
.card-head { margin-bottom: 18px; align-items: flex-start; }
.card-foot { border-top-color: var(--line); }
.dash-grid { gap: 48px 48px; }
.sl-row { border-radius: 0; border-bottom: 1px solid var(--line); }
.sl-row:hover { background: var(--surface-2); }
.sl-n { color: var(--accent-text); font-weight: 500; }
.sl-meta b { font-family: var(--font-display); font-weight: 500; font-size: 17px; letter-spacing: -.01em; }

/* borítók tipográfiával */
.cover-fill .cover-type, .hub-cover .cover-type, .hero-cover .cover-type, .pr-cover .cover-type {
  display: block; position: absolute; z-index: 1; left: 14px; right: 14px; bottom: 12px;
  font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 26px; line-height: .98; letter-spacing: -.02em; color: #fff; text-wrap: balance; }
.cover-fill .cover-artist, .hub-cover .cover-artist, .hero-cover .cover-artist, .pr-cover .cover-artist {
  display: block; position: absolute; z-index: 1; left: 14px; top: 12px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: rgb(255 255 255 / .85); }
.hub-cover .cover-type { font-size: 40px; left: 20px; bottom: 18px; }
.hub-cover .cover-artist { left: 20px; top: 18px; }

/* hero: sötét lemezborító */
.hero { --text: var(--cream); --text-2: oklch(.8 .02 85); --text-3: oklch(.65 .02 85); --line: oklch(1 0 0 / .14); --line-strong: oklch(1 0 0 / .3); --surface-2: oklch(1 0 0 / .06); --surface: oklch(1 0 0 / .04); --hero-ring: var(--ink); --accent-text: oklch(.72 .17 38);
  background: var(--ink); color: var(--text); border: 0; border-radius: var(--radius-xl);
  grid-template-areas: "art art" "main list"; padding: 40px; gap: 32px 56px; }
.hero-art { display: grid; grid-area: art; grid-template-columns: repeat(4, 1fr); margin: -40px -40px 8px; height: 210px; }
.hero-cover { width: 100%; height: 100%; border-radius: 0; }
.hero-cover .cover-type { font-size: 30px; }
.hero-main { grid-area: main; }
.hero-setlist { grid-area: list; }
.hero .btn-ghost { border-color: var(--cream); color: var(--cream); }
.hero .btn-ghost:hover { background: var(--cream); color: var(--ink); }
.hero .seg button.on { background: var(--cream); color: var(--ink); }
.hero .chip { color: var(--text-2); }
.hero .sl-row { border-bottom-color: oklch(1 0 0 / .12); }
.hero .status { --st-learning: oklch(.78 .13 70); --st-ok: oklch(.75 .1 250); --st-ready: oklch(.78 .12 155); }

/* naptár: rácsos lap */
.cal-grid { gap: 0; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
.cal-wd { border: 0; padding: 8px; background: var(--bg); }
.cal-cell { border-radius: 0; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 84px; }
.cal-cell.selected { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); }
.cal-cell .cal-d { font-family: var(--font-display); font-size: 18px; font-weight: 400; }
.cal-cell.plan { background: repeating-linear-gradient(-45deg, transparent 0 6px, oklch(.6 .19 35 / .06) 6px 7px); }
.cal-marks i { border-radius: 1px; width: 12px; height: 12px; }

/* dalok */
.song-grid { gap: 40px 28px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.song-card { background: transparent; border: 0; border-radius: 0; overflow: visible; }
.song-card:hover { transform: none; }
.song-card:hover .sc-art { transform: translateY(-3px) rotate(-.4deg); box-shadow: 0 18px 30px oklch(.2 .02 60 / .22); }
.sc-art { border-radius: var(--radius-cover); overflow: hidden; transition: transform .25s, box-shadow .25s; box-shadow: 0 2px 0 oklch(.2 .02 60 / .08); }
.sc-play { background: var(--cream); color: var(--ink); opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
.song-card:hover .sc-play, .song-card:focus-within .sc-play { opacity: 1; transform: none; }
.sc-fav { left: auto; right: 12px; background: rgb(255 255 255 / .2); }
.sc-body { padding: 14px 0 0; }
.sc-title { font-family: var(--font-display); font-size: 21px; font-weight: 500; letter-spacing: -.01em; }
.sc-foot { border-top-color: var(--line); }
.song-table { background: transparent; border: 0; border-top: 2px solid var(--ink); border-radius: 0; }
.sr-title b { font-family: var(--font-display); font-weight: 500; font-size: 17px; }

/* song hub */
.hub-hero { --hub-bg: linear-gradient(120deg, oklch(.88 .05 var(--h)), oklch(.94 .02 var(--h))); border: 0; padding: 40px; gap: 44px; grid-template-columns: 280px minmax(0, 1fr); }
.hub-cover { width: 280px; height: 280px; box-shadow: 0 30px 50px oklch(.2 .03 var(--h) / .3); }
.hub-artist { font-family: var(--font-display); font-style: italic; font-size: 24px; }
.chord { background: transparent; border-color: var(--line-strong); border-radius: var(--radius); }
.ch-dot { fill: var(--ink); } .ch-nut { fill: var(--ink); }
.bars { border-left-color: var(--ink); }
.ch { font-family: var(--font-display); font-weight: 600; font-style: italic; font-size: 1.35em; color: var(--accent-text); }
.tab { background: transparent; border: 1px solid var(--line); color: var(--text); }
.note { background: transparent; border-left: 3px solid var(--accent); border-radius: 0; font-family: var(--font-display); font-size: 16px; font-style: italic; }
.note b { font-style: normal; font-family: var(--font-body); font-size: 14px; }
.video { border-radius: var(--radius); }
.video-card { border: 0; }

/* mini player — tinta pirula */
.mini { --text: var(--cream); --text-2: oklch(.8 .02 85); --text-3: oklch(.65 .02 85); --line: oklch(1 0 0 / .14); --surface-2: oklch(1 0 0 / .08); background: var(--ink); color: var(--cream); border: 0; border-radius: 99px; padding: 8px 10px 8px 8px; box-shadow: 0 16px 40px oklch(.2 .02 60 / .35); }
.mini .cover { border-radius: 50%; }
.mini .play-btn { background: var(--accent); color: #fff; }
.mini-progress { left: 60px; right: 60px; bottom: 5px; border-radius: 2px; }
.dock { padding-bottom: 20px; }

/* próba mód — sötét színpad */
.practice { --text: var(--cream); --text-2: oklch(.8 .02 85); --text-3: oklch(.62 .02 85); --line: oklch(1 0 0 / .12); --line-strong: oklch(1 0 0 / .24); --surface: oklch(1 0 0 / .05); --surface-2: oklch(1 0 0 / .07); --accent-text: oklch(.72 .17 38); --accent-soft: oklch(.6 .19 35 / .2); --pr-bg: var(--ink); --pr-bar-bg: oklch(.17 .012 60); }
.practice .ch-dot, .practice .ch-nut { fill: var(--cream); }
.practice .bars { border-left-color: var(--accent); }
.practice .pr-title { font-size: 44px; font-style: italic; font-weight: 400; }
.practice .chip { color: var(--text-2); }

@container app (max-width: 760px) {
  .sidebar { display: none; }
  .topbar { height: 60px; border-bottom-width: 2px; padding: 0 12px 0 16px; }
  .top-actions { margin-left: auto; }
  .m-brand .logo-bg { fill: var(--ink); }
  .m-brand .band-meta b { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
  .main { padding: 24px 16px 28px; }
  .hero { padding: 20px; grid-template-areas: "art" "main" "list"; gap: 20px; }
  .hero-art { margin: -20px -20px 0; height: 120px; }
  .hero-cover .cover-type { font-size: 16px; left: 8px; right: 8px; bottom: 8px; }
  .hero-cover .cover-artist { display: none; }
  .dash-grid { gap: 32px; }
  .song-grid { gap: 24px 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sc-title { font-size: 17px; }
  .cover-fill .cover-type { font-size: 19px; left: 10px; right: 10px; bottom: 9px; }
  .cover-fill .cover-artist { font-size: 9.5px; left: 10px; top: 9px; }
  .sc-play { opacity: 1; transform: none; }
  .hub-hero { grid-template-columns: 108px minmax(0, 1fr); padding: 18px; gap: 14px 16px; }
  .hub-cover { width: 108px; height: 108px; }
  .hub-cover .cover-type { font-size: 15px; left: 8px; bottom: 8px; }
  .hub-cover .cover-artist { display: none; }
  .hub-artist { font-size: 18px; }
  .dock { padding: 0; background: var(--bg); border-top: 2px solid var(--ink); }
  .mini { margin: 8px 8px 0; border-radius: 99px; }
  .mini-progress { left: 56px; right: 24px; }
  .ws-day { border-radius: 99px; padding: 10px 0 12px; }
  .ws-day.today { background: var(--ink); border-color: var(--ink); color: var(--cream); }
  .ws-day b { font-family: var(--font-display); font-weight: 500; font-size: 19px; }
  .practice .pr-title { font-size: 28px; }
}
</style>
<script src="shared/data.js"></script>
<script src="shared/screens.js"></script>
<script src="shared/frame.js"></script>
</head>
<body></body>
</html>
