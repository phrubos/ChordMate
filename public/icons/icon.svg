<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#09090b"/>
  <!-- Amber glow circle -->
  <circle cx="256" cy="256" r="200" fill="#f59e0b" opacity="0.12"/>
  <!-- Guitar icon centered -->
  <g transform="translate(256,256)" fill="none" stroke="#f59e0b" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Guitar body -->
    <ellipse cx="0" cy="80" rx="72" ry="88"/>
    <!-- Guitar neck -->
    <rect x="-12" y="-160" width="24" height="180" rx="8"/>
    <!-- Guitar head -->
    <rect x="-20" y="-190" width="40" height="36" rx="6"/>
    <!-- Frets -->
    <line x1="-12" y1="-100" x2="12" y2="-100"/>
    <line x1="-12" y1="-70" x2="12" y2="-70"/>
    <line x1="-12" y1="-40" x2="12" y2="-40"/>
    <!-- Sound hole -->
    <circle cx="0" cy="80" r="30" stroke="#f59e0b" stroke-width="12"/>
    <!-- Strings -->
    <line x1="-6" y1="-160" x2="-6" y2="30" stroke="#f59e0b" stroke-width="3" opacity="0.7"/>
    <line x1="0" y1="-160" x2="0" y2="30" stroke="#f59e0b" stroke-width="3" opacity="0.7"/>
    <line x1="6" y1="-160" x2="6" y2="30" stroke="#f59e0b" stroke-width="3" opacity="0.7"/>
  </g>
</svg>
